# On each push to main: Changesets keeps the "Release @morphemecms/cms" pull request open, and when that pull request
# has been merged, the new version is staged on npm for latest; once the owner has approved it on npmjs.com (2FA), it
# gets the tag v<version> and a GitHub release, and morpheme-staging is rebuilt. While changesets are pending, a
# test version (X.Y.Z-next-<time>) is staged for next. A push to a version line's branch (0.18, 0.19 ...) stages a test version
# of that line under its own tag next-<line> (job next-line; scripts/publish-next.mjs), never next and never latest, and
# opens no Release PR: only main releases. npm's trusted publishing trusts this one file and lets it only
# stage (npm stage publish): no key, and nothing reaches npm without the owner's approval.
# The "next" job only stages and ends: it never waits for the approval, so it holds no runner slot and a newer push
# cannot cancel a wait. Rebuilding morpheme-staging for an approved next version is the job of
# staging-follows-next.yml, which compares npm's next tag every ten minutes. "latest" waits (up to four hours) and is
# never cancelled by a newer run.
name: Publish

on:
  push:
    branches: [main, '0.[0-9]+']

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    # Only main has a Release PR and a latest; a version line only stages (job next-line).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One at a time; the jobs that wait for an approval do not hold it.
    concurrency: release
    outputs:
      pending: ${{ steps.changesets.outputs.hasChangesets }}
      staged: ${{ steps.stage.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The release gate reads the first parent of the Release PR's merge commit.
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm stage publish needs npm 11.15.0 or newer.
      - run: npm install -g npm@^11.15.0
      # The types of the .mjs modules are written from their JSDoc when it is packed (prepack).
      - run: npm ci --no-audit --no-fund
      # The Release PR runs changeset version, then scripts/starter.mjs, so the starter pins the version it releases.
      - id: changesets
        uses: changesets/action@v1
        with:
          title: Release @morphemecms/cms
          commit: Release @morphemecms/cms
          version: npm run release:version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No changesets pending: the Release PR was merged (or nothing changed). Stage its version unless npm has it.
      # THE RELEASE GATE (owner, 18 Nov 2026): latest is staged only when npm's `next` was built from exactly this code and staging runs that
      # `next` version (scripts/release-gate.mjs). It only checks; if it fails, nothing is staged. Only this step stages latest, so the
      # `next` jobs never run it. STAGING_URL is a repository variable.
      - id: stage
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "@morphemecms/cms@$v" version >/dev/null 2>&1; then exit 0; fi
          node scripts/release-gate.mjs
          npm stage publish --tag latest
          echo "version=$v" >> "$GITHUB_OUTPUT"

  latest:
    needs: release
    if: needs.release.outputs.staged != ''
    runs-on: ubuntu-latest
    # Waits for the owner's approval: up to four hours, then re-run this job.
    timeout-minutes: 360
    env:
      V: ${{ needs.release.outputs.staged }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STAGING_DEPLOY_HOOK: ${{ secrets.STAGING_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v5
      - name: Wait until the owner has approved it on npmjs.com
        timeout-minutes: 240
        run: until npm view "@morphemecms/cms@$V" version >/dev/null 2>&1; do sleep 60; done
      - name: Tag it and make the GitHub release with its section of CHANGELOG.md
        run: |
          git tag "v$V"
          git push origin "v$V"
          notes=$(node -e "const s=require('fs').readFileSync('CHANGELOG.md','utf8').split(/^## /m).find(x=>x.split(/\r?\n/)[0].trim()===process.env.V)||'';console.log(s.split(/\r?\n/).slice(1).join('\n').trim())")
          gh release create "v$V" --title "v$V" --notes "$notes"
      - name: Rebuild morpheme-staging with it
        if: env.STAGING_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$STAGING_DEPLOY_HOOK" > /dev/null

  # Stages only. The approval and the staging rebuild are handled by staging-follows-next.yml.
  next:
    needs: release
    if: needs.release.outputs.pending == 'true'
    runs-on: ubuntu-latest
    # One at a time, in order; a push never cancels a job halfway through staging.
    concurrency:
      group: publish-next
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.15.0
      - run: npm ci --no-audit --no-fund
      # Only in this checkout: nothing is committed.
      - run: npx changeset version --snapshot next
      # Only empty changesets pending: the version is unchanged, and there is nothing to stage.
      - run: |
          v=$(node -p "require('./package.json').version")
          if [ "$v" = "$(git show HEAD:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")" ]; then exit 0; fi
          npm stage publish --tag next

  # A version line (0.18, 0.19 ...): stages its pending changesets as X.Y.0-next-<time> under the tag next-<line>. Stages only,
  # like `next`: nothing is tagged, no GitHub release, no latest, and the owner approves it on npmjs.com.
  next-line:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    # Shares the group with `next`: one stage at a time, so two versions never get the same second.
    concurrency:
      group: publish-next
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.15.0
      - run: npm ci --no-audit --no-fund
      - id: base
        run: echo "version=$(git show HEAD:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")" >> "$GITHUB_OUTPUT"
      # Only in this checkout: nothing is committed.
      - run: npx changeset version --snapshot next
      - id: plan
        run: node scripts/publish-next.mjs
        env:
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ steps.base.outputs.version }}
      - if: steps.plan.outputs.action == 'stage'
        run: npm stage publish --tag "${{ steps.plan.outputs.tag }}"
