# The CMS's checks on each pull request into main or into the 0.17 integration branch (package.json's check,
# check:screens, check:demo and check:starter), and that it has a changeset (CLAUDE.md), so each branch can always be
# released. The changeset is compared with the pull request's own base branch. Free here: the repository is public.
# The job's name, check, is the status check that main's branch protection requires.
name: Check

on:
  pull_request:
    branches: [main, '0.17']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # changeset status compares with origin/<the pull request's base branch>.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      # Danish text only in the language files; scripts/check-language.mjs.
      - run: npm run check:language
      # The language check's and the text lookup's own tests.
      - run: node --test lib/danish.test.mjs lib/translate.test.mjs
      - name: The pull request has a changeset
        if: github.head_ref != 'changeset-release/main' # The Release PR turns the changesets into CHANGELOG.md.
        run: npx changeset status --since=origin/${{ github.base_ref }}
      # Prettier, the unit tests, the package's types, the demo built (its content checked by the editor's rules) and
      # each of its pages the same after a save in the editor.
      - run: npm run check
      # Every screen of the editor on the built demo, on a phone and on a computer.
      # If apt is down, the runner's own libraries are used and only the browser is downloaded.
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run check:screens
      # The demo built with the standard theme.
      - run: npm run check:demo
      # The starter as a new site with the package from npm pack: its own checks (with check:worker) and its build.
      - run: npm run check:starter
