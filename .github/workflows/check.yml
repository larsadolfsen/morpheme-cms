# The CMS's checks on each pull request into main, into the 0.17, 0.18 or 0.19 integration branch or into a feature branch (feature/**) (package.json's check,
# check:screens, check:demo and check:starter), and that it has a changeset (.claude/skills/changesets), so each branch can always be
# released.
#
# LEVELS (scripts/ci-changes.mjs checkLevel: feature/** -> feature, 0.* -> line, main -> full; unknown base -> full). Until PR 3 of
# docs/superpowers/plans/2026-11-18-ci-check-levels.md the feature level runs exactly what the line level runs (the light check).
# TWO SIZES (owner, 16 Nov 2026: a merge into a version line shows on the demo within minutes). A pull request whose base is a version
# line (0.17, 0.18, 0.19; not the Release PR) gets the LIGHT check: changes, static and the 8 screens shards (about 8 minutes). It skips
# screens-extra, demo and starter (the starter shards take 14 to 20 minutes). A pull request into main (the merge of a version line,
# merge-0.18-into-main-N) and the Release PR run EVERYTHING; nothing reaches npm `next` or the owner without a full run. The job
# `changes` prints light=true|false (scripts/ci-changes.mjs isLight); any error gives light=false, so everything runs. The changeset
# check stays on every pull request. The rule lives in .claude/skills/checks, "What CI runs". The changeset is compared with the pull request's own base branch. Free here: the repository is public.
# The slow parts run side by side as jobs of their own (the run takes about as long as the slowest), and the job named check
# only waits for them all: it is the status check that main's branch protection and the PM look at, and it is green only
# when every other job is green. The editor's screens are split into as many parts as the matrix of the screens job lists
# (scripts/editor-screens.mjs --shard K/N, N is the matrix's size, so a part is never left out: list 1..N there).
#
# A pull request that changes only files that neither `starter` nor `demo` read also skips those two (the 4 starter shards and the
# demo): the job `changes` prints starter_demo=false, and scripts/ci-changes.mjs (needsStarterDemo) lists what is safe to skip
# (docs, tests, .claude/, .agents/, changesets, the other workflows, staging-watcher/ and the static-only check scripts); the
# workflow, ci-changes.mjs, the Release PR, an empty diff and any other path run them (when in doubt, run). `screens`,
# `screens-extra` and `static` are not affected.
#
# A docs-only pull request skips the heavy jobs (screens, screens-extra, demo, starter). The job `changes` decides from the
# pull request's diff against its base branch (plain git, then scripts/ci-changes.mjs): docs-only means every changed file is
# under .claude/skills/ or docs/, a changeset, or CLAUDE.md, AGENTS.md, README.md or SECURITY.md; the Release PR, an empty diff
# and any other path run everything (when in doubt, run). release-notes/ and CHANGELOG.md are never skipped: check:release-notes,
# the notes tests and the editor's build read them. `static` runs on every pull request. There is no workflow-level paths-ignore:
# the job `check` is the required status check and must always report. It is green when `static` and `changes` are green and each
# heavy job is green, or skipped on a docs-only pull request (demo and starter also when starter_demo is false; screens-extra, demo and
# starter also when light is true, a pull request into a version line); a failed, cancelled or wrongly skipped job makes it red
# (scripts/ci-changes.mjs, tested in scripts/ci-changes.test.mjs; the rule is in .claude/skills/checks, "What CI runs").
name: Check

on:
  pull_request:
    branches: [main, '0.17', '0.18', '0.19', 'feature/**']

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older queued and running Check runs, so only its newest head is
# checked. The group is per pull request (its number), so runs on different pull requests never cancel each other; the
# Release PR is a pull request like the others. The workflow has no push trigger, so a push to main or a version line is
# never cancelled here (github.ref is only the fallback for an event without a pull request). In a cancelled run the job
# check still runs (if: always()) and fails on that old head only; the PM looks at the newest head's run.
concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the pull request is docs-only (see the header). Any error here gives docs_only=false, so everything runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      starter_demo: ${{ steps.diff.outputs.starter_demo }}
      level: ${{ steps.diff.outputs.level }}
      light: ${{ steps.diff.outputs.light }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" > changed.txt; then
            cat changed.txt
            node scripts/ci-changes.mjs classify "$HEAD_REF" "$BASE" < changed.txt | tee -a "$GITHUB_OUTPUT"
          else
            echo 'git diff failed: running everything'
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            echo 'starter_demo=true' >> "$GITHUB_OUTPUT"
            echo 'level=full' >> "$GITHUB_OUTPUT"
            echo 'light=false' >> "$GITHUB_OUTPUT"
          fi

  # Prettier, the language and unit tests, types, the demo built and each of its pages the same after a save, and the changeset.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # changeset status compares with origin/<the pull request's base branch>.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Danish text only in the language files; scripts/check-language.mjs.
      - run: npm run check:language
      # The language check's and the text lookup's own tests.
      - run: node --test lib/danish.test.mjs lib/translate.test.mjs
      - name: The pull request has a changeset
        if: github.head_ref != 'changeset-release/main' # The Release PR turns the changesets into CHANGELOG.md.
        run: npx changeset status --since=origin/${{ github.base_ref }}
      # Prettier, the unit tests, the package's types, the demo built (its content checked by the editor's rules) and
      # each of its pages the same after a save in the editor.
      - run: npm run check

  # Every screen of the editor on the built demo, on a phone and on a computer, in parts that run side by side.
  screens:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # If apt is down, the runner's own libraries are used and only the browser is downloaded.
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run check:screens:shard -- ${{ matrix.shard }}/${{ strategy.job-total }}

  # The checks that run once over the whole built demo (saving twice, unlisted pages, the preview).
  screens-extra:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.light != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run check:screens:extra

  # The demo built with the standard theme.
  demo:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.starter_demo != 'false' && needs.changes.outputs.light != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The demo's own build (npm run build) makes the package copy that check:demo imports.
      - run: npm run build
      - run: npm run check:demo

  # The starter as a new site with the package from npm pack: its own checks (with check:worker) and its build.
  # With its screens: every screen of the editor on the starter too, so the checks sites run never lean on the demo's content.
  # The screens part is split like the demo's (--shard K/N, N is the matrix's size); the rest of the starter's checks run in each part.
  starter:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.starter_demo != 'false' && needs.changes.outputs.light != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: npm run check:starter -- --screens --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The one status check that is required: green when static and changes are green and every heavy job is green, or skipped on a
  # docs-only pull request (a failed, cancelled or wrongly skipped one fails it; scripts/ci-changes.mjs).
  check:
    if: always()
    needs: [changes, static, screens, screens-extra, demo, starter]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          NEEDS: ${{ toJson(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          STARTER_DEMO: ${{ needs.changes.outputs.starter_demo }}
          LIGHT: ${{ needs.changes.outputs.light }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | node scripts/ci-changes.mjs verdict "$DOCS_ONLY" "$STARTER_DEMO" "$LIGHT"
